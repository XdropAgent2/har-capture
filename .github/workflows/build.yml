name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "XDROP_HAR_Capture" --clean har_capture.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XDROP_HAR_Capture
          path: dist/XDROP_HAR_Capture.exe

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: XDROP HAR Capture v1.0
          files: dist/XDROP_HAR_Capture.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
